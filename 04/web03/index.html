<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
        }

        /* ------------ layout ------------- */

        #main {
            background: #e6e6e6;
            width: 1024px;
            height: 768px;
            margin: auto;

            display: grid;
            grid-template-columns: 100%;
            grid-template-rows: 120px 30px 1fr 78px;


            #top,
            #marquee,
            #content,
            #footer {
                grid-column: span 1;
                grid-row: span 1;
            }
        }


        /* ------------ styles ------------- */

        #top {
            background: url(images/0401.jpg);

            a {
                color: #FFFFFF;
                text-align: center;
                line-height: 120px;
                font-size: 52px;
                font-family: '標楷體';
                text-decoration: none;
                display: block;

                /* 橫幅文字陰影 */
                text-shadow: #333333 10px 10px 15px;
            }
        }

        #marquee {
            font-size: 19px;
            font-family: '標楷體';
            color: #0000FF;
            line-height: 30px;

            background: url(images/0402.jpg);
            background-position: 0px 0px;
        }

        #content {
            background: url(images/0402.jpg);
            background-position: 0px -30px;

            iframe {
                width: 100%;
                height: 100%;
            }
        }

        #footer {
            background: #666600;
            color: #FFFFFF;
            font-family: '標楷體';
            line-height: 2;
            text-align: left;

            a {
                text-decoration: none;
                color: #FFFFFF;
            }

            a:visited {
                color: #FF9999;
            }
        }
    </style>
</head>

<body>
    <main id="main">
        <div id="top">
            <a href="index.html">流行精品購物網站</a>
        </div>
        <div id="marquee">
            <marquee>大家來購物網！精品商品特價大拍賣！要買要快！</marquee>
        </div>
        <div id="content">
            <iframe src="results/main.html" frameborder="0" name="content"></iframe>
        </div>
        <div id="footer">
            <a href="results/message.html" target="content">訪客留言版</a>
            <p>網頁設計及維護：03許峻耀、近更新日期：2024/11/08</p>
        </div>
    </main>
</body>

</html>
