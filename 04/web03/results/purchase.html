<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>main</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        table {
            border-collapse: collapse;
            text-align: center;
            padding: 0;


            tr {
                td {
                    width: 400px;
                    height: 100%;
                }

                td img {
                    height: 100%;
                }

                &:nth-child(odd) td {
                    height: 100px;
                }

                &:nth-child(even) td {
                    height: 150px;
                }
            }

        }

        form {
            margin: auto;
            width: fit-content;
        }

        form #buttons {
            text-align: center;
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <form action="">
        <table border="1">
            <tr>
                <td>
                    真皮皮包
                </td>
                <td>
                    真皮短夾
                </td>
            </tr>
            <tr>
                <td>
                    <img src="../images/0403.jpg">
                </td>
                <td>
                    <img src="../images/0404.jpg">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="radio" name="buy" value="購買" checked>購買
                    <input type="radio" name="buy" value="不購買">不購買
                    <input type="radio" name="buy" value="考慮中">考慮中
                </td>
                <td>
                    <input type="radio" name="buy2" value="購買">購買
                    <input type="radio" name="buy2" value="不購買">不購買
                    <input type="radio" name="buy2" value="考慮中" checked>考慮中
                </td>
            </tr>
        </table>
        <div id="buttons">
            <input type="button" value="送出">
            <input type="reset" value="重製">
        </div>
    </form>

    <script>

    </script>
</body>

</html>
