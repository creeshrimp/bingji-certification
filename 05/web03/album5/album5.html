<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>album5</title>
    <script src="../jquery-2.1.4.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            text-align: center;
        }

        h1 {
            font-size: 20px;
            font-family: '標楷體';
            font-weight: bold;
            text-decoration: underline;
            color: #0000FF;
        }

        #album {
            width: 400px;
            height: 300px;

            margin: auto;

            #display {
                width: 100%;
                height: 300px;

                border: 5px solid #0000FF;

                img {
                    display: block;
                    width: 100%;
                    height: 100%;
                }
            }

            #thumbnails {
                display: flex;
                justify-content: space-between;

                padding: 1.5rem 0;

                img {
                    display: block;
                    width: 60px;
                    height: 45px;

                    border: 5px solid #0000FF;
                    cursor: pointer;
                }
            }
        }
    </style>
</head>

<body>
    <h1>蘭嶼賞魚去</h1>
    <div id="album">
        <div id="display">
            <img src="../images/0551.jpg">
        </div>
        <div id="thumbnails">
            <img src="../images/0551.jpg">
            <img src="../images/0552.jpg">
            <img src="../images/0553.jpg">
            <img src="../images/0554.jpg">
            <img src="../images/0555.jpg">
        </div>
    </div>

    <script>
        $('#thumbnails').on('click', 'img', function () {
            $('#display img').attr('src', $(this).attr('src'))
        })
    </script>
</body>

</html>
